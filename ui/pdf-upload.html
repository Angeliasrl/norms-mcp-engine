<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'none'; font-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">
  <title>Carica il PDF in NORMS</title>
  <link rel="stylesheet" href="/ui/pdf-upload.css">
</head>
<body>
  <main>
    <h1>Carica il PDF in NORMS</h1>
    <p>Il PDF viene inviato alla sessione temporanea NORMS. Il nome del file non viene usato come evidenza o registrato nei log.</p>
    <label for="pdf">Documento PDF</label>
    <input id="pdf" type="file" accept="application/pdf,.pdf" aria-describedby="limits">
    <p id="limits">Sono accettati soltanto PDF entro il limite indicato dalla sessione.</p>
    <progress id="progress" value="0" max="100" aria-label="Avanzamento caricamento">0%</progress>
    <div class="actions">
      <button id="send" type="button" disabled>Carica</button>
      <button id="cancel" type="button" disabled>Annulla</button>
      <button id="delete" type="button">Elimina sessione</button>
    </div>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
  <script src="/ui/pdf-upload.js" defer></script>
</body>
</html>
